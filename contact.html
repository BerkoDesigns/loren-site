<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free consultation | Loren Berkovics, LCSW</title>
<meta name="description" content="Request a free 15-minute consultation with Loren Berkovics, LCSW.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="contact">

<section><div class="wrap narrow">
  <div class="eyebrow">Free consultation</div>
  <h1>Let's talk</h1>
  <p class="lede">Fill this in and I'll get back to you to find a time for a free 15-minute call.</p>

  <div class="notice"><strong>Please don't share private details here.</strong> Keep it to the basics below. We can talk about everything else on our call. If you're in crisis, call or text 988 or call 911.</div>

  <form class="contact" id="contactForm" novalidate>
    <div class="two">
      <label>Your name<input name="name" type="text" autocomplete="name" required></label>
      <label>Who is therapy for?
        <select name="for">
          <option>Myself</option>
          <option>My child</option>
          <option>My teen</option>
        </select>
      </label>
    </div>
    <div class="two">
      <label>Email<input name="email" type="email" autocomplete="email"></label>
      <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
    </div>
    <label>Best time to reach you<input name="best_time" type="text" placeholder="Weekday mornings"></label>
    <label>State you live in
      <select name="state">
        <option>New York</option>
        <option>Florida</option>
        <option>Rhode Island</option>
        <option>Other</option>
      </select>
    </label>
    <div style="position:absolute;left:-9999px" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
    <div><button class="btn" type="submit">Send request</button></div>
    <div class="form-status" role="status" aria-live="polite"></div>
  </form>
</div></section>

<script src="site.js"></script>
<script>initContactForm(document.getElementById("contactForm"));</script>
</body>
</html>
